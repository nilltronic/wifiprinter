name: Acknowledge Gallery Submission

on:
  issues:
    types: [opened]

jobs:
  say-thanks:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check if this is a gallery submission
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title || "";
            core.setOutput("is_gallery", title.startsWith("[Gallery]"));

      - name: Comment
        if: steps.check.outputs.is_gallery == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: "Thanks for your submission! It's been received and is waiting for review before it appears in the gallery. 🎉"
            });
